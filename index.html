<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的网址中转站</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        h1 {
            color: #333;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-size: 18px;
            color: #fff;
            background-color: #00a1d6; /* B站经典蓝色 */
            text-decoration: none;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #00b5e5;
        }
    </style>
</head>
<body>
    <h1>我的网址中转站</h1>
    <!-- 点击按钮直接中转跳转到 Bilibili -->
    <a href="https://www.bilibili.com" target="_blank" class="btn">前往 Bilibili</a>
</body>
</html>
